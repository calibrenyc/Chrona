<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"><title>Chrona Updater</title><link rel="stylesheet" href="../renderer/styles.css"><style>body{padding:32px;overflow:auto}img{width:58px}h1{margin:22px 0 12px}p{color:var(--muted);line-height:1.6}pre{white-space:pre-wrap;font:inherit;max-height:230px;overflow:auto}progress{width:100%;accent-color:var(--accent);margin:18px 0}.actions{display:flex;gap:10px;margin:20px 0}button{padding:12px 16px}.actions .primary{width:auto;margin:0}[hidden]{display:none!important}</style></head><body><img src="../renderer/icon.png" alt="Chrona"><h1>Chrona Updater</h1><p id="status" role="status">Checking GitHub Releases…</p><pre id="notes"></pre><progress id="progress" max="100" value="0" hidden></progress><div class="actions"><button id="install" class="primary" hidden>Download and install</button><button id="check">Check again</button><button id="launch">Launch Chrona</button><button id="details" hidden>View details</button></div><script src="standalone-ui.js"></script></body></html>
